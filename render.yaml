services:
  - type: web
    name: risk-analysis-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: python3 -m pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:///./predictive_pm.db"
      - key: SECRET_KEY
        generateValue: true
